<!DOCTYPE html><html lang="fr"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090914"><title>VYRO — Inscription</title><style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #090914;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px 18px;
}

.container {
    width: 100%;
    max-width: 420px;
}

.logo {
    text-align: center;
    margin-bottom: 30px;
}

.logo h1 {
    font-size: 38px;
    letter-spacing: 5px;
    color: #b18aff;
}

.logo p {
    color: #77798e;
    font-size: 12px;
    margin-top: 8px;
}

.card {
    background: #111321;
    border: 1px solid #25283a;
    border-radius: 22px;
    padding: 27px 22px;
}

.card h2 {
    font-size: 25px;
    margin-bottom: 9px;
}

.description {
    color: #85889d;
    font-size: 13px;
    margin-bottom: 25px;
    line-height: 1.5;
}

.input-group {
    margin-bottom: 17px;
}

label {
    display: block;
    font-size: 13px;
    color: #c7c8d4;
    margin-bottom: 9px;
}

input {
    width: 100%;
    padding: 15px;
    border-radius: 12px;
    border: 1px solid #303449;
    background: #0b0e1b;
    color: white;
    outline: none;
    font-size: 14px;
}

input:focus {
    border-color: #a987ff;
}

.password-box {
    position: relative;
}

.password-box input {
    padding-right: 65px;
}

.show-password {
    position: absolute;
    right: 13px;
    top: 50%;
    transform: translateY(-50%);
    color: #b18aff;
    font-size: 12px;
    cursor: pointer;
    border: none;
    background: none;
}

.terms {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin: 20px 0;
    color: #999caf;
    font-size: 12px;
    line-height: 1.5;
}

.terms input {
    width: 16px;
    height: 16px;
    margin-top: 2px;
    accent-color: #a987ff;
}

.terms a {
    color: #b18aff;
    text-decoration: none;
}

.submit-btn {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 13px;
    background: linear-gradient(135deg, #a987ff, #7651d9);
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.submit-btn:disabled {
    opacity: 0.6;
}

.message {
    display: none;
    margin-top: 17px;
    padding: 13px;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.5;
}

.message.success {
    display: block;
    background: #123425;
    color: #8df0b5;
}

.message.error {
    display: block;
    background: #3a1c27;
    color: #ff9baa;
}

.login {
    text-align: center;
    margin-top: 23px;
    color: #9295a9;
    font-size: 13px;
}

.login a {
    color: #b18aff;
    text-decoration: none;
    font-weight: bold;
}

footer {
    text-align: center;
    color: #55596c;
    font-size: 11px;
    margin-top: 25px;
    letter-spacing: 1px;
}
</style></head><body><div class="container"><div class="logo">
    <h1>VYRO</h1>
    <p>Connect without limits.</p>
</div>

<div class="card">

    <h2>Créer un compte</h2>

    <p class="description">
        Rejoins VYRO et commence à discuter avec le monde.
    </p>

    <form id="signupForm">

        <div class="input-group">
            <label for="pseudo">Nom d'utilisateur</label>
            <input
                type="text"
                id="pseudo"
                placeholder="Choisis ton pseudo"
                minlength="3"
                maxlength="25"
                required
            >
        </div>

        <div class="input-group">
            <label for="email">Adresse e-mail</label>
            <input
                type="email"
                id="email"
                placeholder="exemple@email.com"
                required
            >
        </div>

        <div class="input-group">
            <label for="password">Mot de passe</label>

            <div class="password-box">
                <input
                    type="password"
                    id="password"
                    placeholder="8 caractères minimum"
                    minlength="8"
                    required
                >

                <button
                    type="button"
                    class="show-password"
                    onclick="togglePassword('password', this)"
                >Afficher</button>
            </div>
        </div>

        <div class="input-group">
            <label for="confirmPassword">Confirmer le mot de passe</label>

            <div class="password-box">
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Répète ton mot de passe"
                    required
                >

                <button
                    type="button"
                    class="show-password"
                    onclick="togglePassword('confirmPassword', this)"
                >Afficher</button>
            </div>
        </div>

        <div class="terms">
            <input type="checkbox" id="terms" required>

            <label for="terms">
                J'accepte les conditions d'utilisation de VYRO.
            </label>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
            Créer mon compte
        </button>

        <div id="message" class="message"></div>

    </form>

    <div class="login">
        Tu as déjà un compte ?
        <a href="connexion.html">Se connecter</a>
    </div>

</div>

<footer>
    CRÉÉ EN CÔTE D'IVOIRE 🇨🇮
</footer>

</div><script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL =
"https://baudgidnnyjgfnepbiyn.supabase.co";

const SUPABASE_KEY = "sb_publishable_R8oJ3O_avypAbwyATrcreQ_pt47CUb7";

const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const form = document.getElementById("signupForm");
const message = document.getElementById("message");
const submitBtn = document.getElementById("submitBtn");

function afficherMessage(texte, type) {
    message.textContent = texte;
    message.className = "message " + type;
}

window.togglePassword = function(id, button) {

    const input = document.getElementById(id);

    if (input.type === "password") {
        input.type = "text";
        button.textContent = "Masquer";
    } else {
        input.type = "password";
        button.textContent = "Afficher";
    }

};

form.addEventListener("submit", async function(e) {

    e.preventDefault();

    const pseudo = document
        .getElementById("pseudo")
        .value.trim();

    const email = document
        .getElementById("email")
        .value.trim();

    const password = document
        .getElementById("password")
        .value;

    const confirmPassword = document
        .getElementById("confirmPassword")
        .value;

    const terms = document
        .getElementById("terms")
        .checked;

    if (!SUPABASE_KEY) {
        afficherMessage(
            "La configuration Supabase est incomplète.",
            "error"
        );
        return;
    }

    if (pseudo.length < 3 || pseudo.length > 25) {
        afficherMessage(
            "Le pseudo doit contenir entre 3 et 25 caractères.",
            "error"
        );
        return;
    }

    if (password.length < 8) {
        afficherMessage(
            "Le mot de passe doit contenir au moins 8 caractères.",
            "error"
        );
        return;
    }

    if (password !== confirmPassword) {
        afficherMessage(
            "Les deux mots de passe ne correspondent pas.",
            "error"
        );
        return;
    }

    if (!terms) {
        afficherMessage(
            "Tu dois accepter les conditions d'utilisation.",
            "error"
        );
        return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Création du compte...";

    message.className = "message";

    try {

        const { data, error } = await supabase.auth.signUp({

            email: email,

            password: password,

            options: {

                data: {
                    username: pseudo
                },

                emailRedirectTo:
                    window.location.origin + "/connexion.html"

            }

        });

        if (error) {
            throw error;
        }

        if (data.user) {

            afficherMessage(
                "Ton compte a été créé ! Vérifie ta boîte e-mail pour confirmer ton inscription.",
                "success"
            );

            form.reset();

        }

    } catch (error) {

        afficherMessage(
            error.message || "Une erreur est survenue.",
            "error"
        );

    } finally {

        submitBtn.disabled = false;
        submitBtn.textContent = "Créer mon compte";

    }

});

</script></body>
</html>
